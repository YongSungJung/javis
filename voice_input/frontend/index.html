<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: dark; font-family: "Bahnschrift", "Segoe UI", "Malgun Gothic", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #efffff; background: transparent; }
    .console {
      min-height: 300px; padding: 20px 24px 18px; overflow: hidden; position: relative;
      background: transparent;
    }
    .console::before {
      content: ""; position: absolute; inset: -40%; pointer-events: none; opacity: .72; z-index: 0;
      background:
        radial-gradient(ellipse at 50% 47%, rgba(50, 203, 194, .19), transparent 34%),
        radial-gradient(ellipse at 14% 54%, rgba(230, 170, 89, .11), transparent 26%),
        linear-gradient(rgba(119, 238, 230, .09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(119, 238, 230, .09) 1px, transparent 1px);
      background-size: auto, auto, 38px 38px, 38px 38px;
      mask-image: radial-gradient(ellipse at center, black 16%, transparent 76%);
      animation: field-drift 24s ease-in-out infinite alternate;
    }
    .console::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background: linear-gradient(180deg, transparent, rgba(169, 255, 249, .1), transparent);
      background-size: 100% 180px;
      animation: console-scan 9s linear infinite;
    }
    .topline, .hero, .controls { position: relative; z-index: 1; }
    .topline { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .brand { color: #a1fff5; font-size: 13px; font-weight: 700; letter-spacing: 2.5px; text-shadow: 0 0 16px rgba(86, 239, 226, .48); }
    .system-state { margin-top: 8px; color: #e0b977; font-size: 12px; font-weight: 700; letter-spacing: 1.8px; }
    .metrics { display: flex; gap: 34px; text-align: right; }
    .metric-label { display: block; color: #b7d9d8; font-size: 11px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; }
    .metric-value { display: block; margin-top: 5px; color: #f4ffff; font-size: 17px; font-variant-numeric: tabular-nums; text-shadow: 0 0 12px rgba(143, 246, 237, .32); }
    #clock { font-size: 23px; letter-spacing: 1px; }
    .hero { min-height: 116px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 4px; }
    .hero-title { margin-top: 4px; font-size: 13px; font-weight: 700; letter-spacing: 5px; color: #d0fff7; text-shadow: 0 0 18px rgba(101, 255, 239, .6); }
    #status { min-height: 24px; margin-top: 10px; color: #f2ffff; font-size: 15px; font-weight: 600; text-align: center; text-shadow: 0 1px 9px #06151b, 0 0 15px rgba(105, 233, 221, .3); }
    .controls { display: flex; justify-content: center; min-height: 44px; }
    button {
      min-width: 196px; min-height: 46px; padding: 0 24px; border: 1px solid #a0fff1; border-radius: 3px;
      color: #062025; background: linear-gradient(110deg, #9ffff0, #54d6cf); cursor: pointer; font-size: 13px;
      font-weight: 800; letter-spacing: 1.6px; box-shadow: 0 0 26px rgba(76, 229, 217, .3);
      transition: background .2s, box-shadow .2s, transform .2s;
    }
    button:hover { background: linear-gradient(110deg, #c4fff6, #7cece1); box-shadow: 0 0 34px rgba(75, 231, 225, .48); transform: translateY(-1px); }
    button:disabled { opacity: .55; cursor: wait; }
    button.stop { border-color: #ffc28d; color: #281407; background: linear-gradient(110deg, #ffd39c, #f0a66f); box-shadow: 0 0 25px rgba(241, 166, 111, .28); }
    .active #status { color: #b5fff2; }
    @keyframes field-drift { from { transform: translate3d(-1%, -1%, 0); background-position: 0 0, 0 0, 0 0, 0 0; } to { transform: translate3d(1%, 1%, 0); background-position: 4% 3%, -3% 5%, 19px 19px, 19px 19px; } }
    @keyframes console-scan { from { background-position: 0 -180px; } to { background-position: 0 100%; } }
    @media (max-width: 540px) {
      .console { min-height: 300px; padding: 16px 12px 14px; }
      .topline { display: block; }
      .metrics { justify-content: flex-start; gap: 22px; margin-top: 15px; text-align: left; }
      .metric-label { font-size: 10px; }
      .metric-value { font-size: 14px; white-space: nowrap; }
      #clock { font-size: 19px; }
      .hero { min-height: 108px; }
      .brand { font-size: 12px; letter-spacing: 1.6px; }
      #status { max-width: 92vw; font-size: 14px; }
      button { min-height: 48px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .console::before, .console::after { animation: none; }
    }
  </style>
</head>
<body>
  <main class="console" id="console">
    <header class="topline">
      <div>
        <div class="brand">J.A.R.V.I.S. / PERSONAL SYSTEM</div>
        <div class="system-state" id="systemState">STANDBY</div>
      </div>
      <div class="metrics">
        <div><span class="metric-label">Local time</span><span class="metric-value" id="clock">--:--:--</span></div>
        <div><span class="metric-label">Weather</span><span class="metric-value" id="weather">위치 확인 중</span></div>
      </div>
    </header>
    <section class="hero">
      <div class="hero-title">J A R V I S</div>
      <div id="status" aria-live="polite">시스템을 시작할 준비가 되었습니다.</div>
    </section>
    <footer class="controls"><button id="startButton" type="button">시스템 시작</button></footer>
  </main>
  <script>
    const consolePanel = document.getElementById("console");
    const button = document.getElementById("startButton");
    const status = document.getElementById("status");
    const systemState = document.getElementById("systemState");
    const clock = document.getElementById("clock");
    const weather = document.getElementById("weather");
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let language = "ko-KR";
    let active = false;
    let listening = false;
    let phase = "off";
    let blocked = false;
    let pendingActive = null;
    let eventSequence = 0;
    let lastToggleAt = 0;
    let lastSpeechId = -1;

    function sendValue(type, text = "") {
      eventSequence += 1;
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: { type, text, id: `${Date.now()}-${eventSequence}` }
      }, "*");
    }

    function updateClock() {
      const now = new Date();
      clock.textContent = new Intl.DateTimeFormat("ko-KR", {
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
      }).format(now);
    }
    updateClock();
    setInterval(updateClock, 1000);

    const weatherLabels = {
      0: "맑음", 1: "대체로 맑음", 2: "구름 조금", 3: "흐림", 45: "안개", 48: "짙은 안개",
      51: "이슬비", 53: "이슬비", 55: "강한 이슬비", 61: "비", 63: "비", 65: "강한 비",
      71: "눈", 73: "눈", 75: "강한 눈", 80: "소나기", 81: "소나기", 82: "강한 소나기",
      95: "뇌우", 96: "우박 동반 뇌우", 99: "강한 뇌우"
    };
    async function loadWeather(latitude, longitude, place) {
      const url = new URL("https://api.open-meteo.com/v1/forecast");
      url.search = new URLSearchParams({
        latitude, longitude, current: "temperature_2m,weather_code", timezone: "auto"
      });
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("weather request failed");
        const data = await response.json();
        const current = data.current;
        weather.textContent = `${place} ${Math.round(current.temperature_2m)}° · ${weatherLabels[current.weather_code] || "날씨"}`;
      } catch (_) {
        weather.textContent = "날씨 정보 없음";
      }
    }
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        ({ coords }) => loadWeather(coords.latitude, coords.longitude, "현재 위치"),
        () => loadWeather(37.5665, 126.9780, "서울"),
        { timeout: 5000, maximumAge: 600000 }
      );
    } else {
      loadWeather(37.5665, 126.9780, "서울");
    }

    function setPhase(nextPhase, message) {
      phase = nextPhase;
      status.textContent = message;
      const labels = {
        off: "STANDBY", wake: "WAKE WORD LISTENING", greeting: "CONNECTED",
        command: "VOICE INPUT", processing: "PROCESSING", speaking: "JARVIS SPEAKING"
      };
      systemState.textContent = labels[nextPhase] || "STANDBY";
    }

    function beginListening(nextPhase, message) {
      if (!recognition || !active || blocked || listening) return;
      setPhase(nextPhase, message);
      try { recognition.start(); }
      catch (_) { window.setTimeout(() => {
        if (active && !listening && !blocked && phase === nextPhase) beginListening(nextPhase, message);
      }, 350); }
    }

    function koreanVoice() {
      const voices = window.speechSynthesis.getVoices();
      const korean = voices.filter((voice) => voice.lang.toLowerCase().startsWith("ko"));
      return korean.find((voice) => /sunhi|heami|yuna|female|여성/i.test(voice.name)) || korean[0] || null;
    }

    function speak(text, onDone) {
      if (!text || !window.speechSynthesis) { if (onDone) onDone(); return; }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = language;
      utterance.rate = 1.12;
      utterance.pitch = 1.04;
      const voice = koreanVoice();
      if (voice) utterance.voice = voice;
      utterance.onend = () => { if (onDone) onDone(); };
      utterance.onerror = () => { if (onDone) onDone(); };
      window.speechSynthesis.speak(utterance);
    }

    if (Recognition) {
      recognition = new Recognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = language;
      recognition.onstart = () => { listening = true; };
      recognition.onresult = (event) => {
        let finalText = "";
        let interimText = "";
        for (let index = event.resultIndex; index < event.results.length; index += 1) {
          const result = event.results[index];
          if (result.isFinal) finalText += result[0].transcript;
          else interimText += result[0].transcript;
        }
        if (interimText) status.textContent = interimText;
        if (!finalText.trim()) return;
        if (phase === "wake" && /자비스|자비쓰|자비즈/i.test(finalText)) {
          setPhase("greeting", "호출을 확인했습니다.");
          recognition.stop();
          sendValue("wake", finalText.trim());
          speak("무엇을 도와드릴까요?", () => beginListening("command", "말씀해 주세요."));
        } else if (phase === "command") {
          setPhase("processing", "요청을 전달하고 있습니다.");
          recognition.stop();
          sendValue("command", finalText.trim());
        } else if (phase === "wake") {
          status.textContent = "호출어 '자비스'를 기다리고 있습니다.";
        }
      };
      recognition.onerror = (event) => {
        const messages = {
          "not-allowed": "마이크 권한을 허용한 뒤 다시 시작해 주세요.",
          "service-not-allowed": "이 브라우저에서 음성 인식을 사용할 수 없습니다.",
          "audio-capture": "사용 가능한 마이크를 찾을 수 없습니다.",
          "no-speech": "호출어를 기다리고 있습니다."
        };
        status.textContent = messages[event.error] || `음성 인식 오류: ${event.error}`;
        if (event.error === "not-allowed" || event.error === "service-not-allowed") blocked = true;
      };
      recognition.onend = () => {
        listening = false;
        if (active && !blocked && phase === "wake") {
          window.setTimeout(() => beginListening("wake", "호출어 '자비스'를 기다리고 있습니다."), 250);
        }
      };
    } else {
      button.disabled = true;
      status.textContent = "음성 인식은 Chrome 또는 Edge에서 사용할 수 있습니다.";
    }

    button.addEventListener("click", () => {
      const now = Date.now();
      if (now - lastToggleAt < 500) return;
      lastToggleAt = now;
      if (active) {
        pendingActive = false;
        active = false;
        blocked = false;
        setPhase("off", "시스템이 대기 상태로 전환되었습니다.");
        consolePanel.classList.remove("active");
        button.classList.remove("stop");
        button.textContent = "시스템 시작";
        if (recognition && listening) recognition.stop();
        window.speechSynthesis?.cancel();
        sendValue("stop");
        return;
      }
      if (!recognition) return;
      pendingActive = true;
      active = true;
      blocked = false;
      consolePanel.classList.add("active");
      button.classList.add("stop");
      button.textContent = "시스템 종료";
      sendValue("start");
      beginListening("wake", "호출어 '자비스'를 기다리고 있습니다.");
    });

    function setFrameHeight() {
      window.parent.postMessage({
        isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: 330
      }, "*");
    }

    window.addEventListener("message", (event) => {
      if (!event.data || event.data.type !== "streamlit:render") return;
      const args = event.data.args || {};
      language = args.language || "ko-KR";
      if (recognition) recognition.lang = language;
      if (pendingActive !== null) {
        if (args.active === pendingActive) pendingActive = null;
      } else if (args.active !== active) {
        active = args.active;
        if (active) {
          consolePanel.classList.add("active");
          button.classList.add("stop");
          button.textContent = "시스템 종료";
          beginListening("wake", "호출어 '자비스'를 기다리고 있습니다.");
        } else {
          if (recognition && listening) recognition.stop();
          setPhase("off", "시스템을 시작할 준비가 되었습니다.");
          consolePanel.classList.remove("active");
          button.classList.remove("stop");
          button.textContent = "시스템 시작";
        }
      }
      if (args.speech_id !== undefined && args.speech_id !== lastSpeechId && args.speech_text) {
        lastSpeechId = args.speech_id;
        setPhase("speaking", "응답을 음성으로 전달하고 있습니다.");
        speak(args.speech_text, () => beginListening("wake", "호출어 '자비스'를 기다리고 있습니다."));
      }
      setFrameHeight();
    });

    window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
    setTimeout(setFrameHeight, 100);
  </script>
</body>
</html>
